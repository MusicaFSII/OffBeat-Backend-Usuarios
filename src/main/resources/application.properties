spring.application.name=usuarios
server.port=${SERVER_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/offbeat_usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:offbeat}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:offbeatpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

google.client.id=283197397130-n94tu6fp5sdfoimkruadar40j2l2k7ea.apps.googleusercontent.com

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method